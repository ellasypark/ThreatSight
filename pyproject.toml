[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatsight"
version = "0.2.0"
description = "Local-first web security investigation with service-context retrieval and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ella (Siyeon) Park" }]

# Local service investigation does not require paid APIs or model downloads.
dependencies = [
    "pydantic>=2.0",
    "polars>=0.20",
    "numpy>=1.26",
    "typer>=0.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ai = ["anthropic>=0.39"]
semantic = ["sentence-transformers>=2.2"]
attack = ["mitreattack-python>=3.0"]
full = ["anthropic>=0.39", "sentence-transformers>=2.2", "mitreattack-python>=3.0"]

[project.scripts]
threatsight = "threatsight.cli:app"

[tool.setuptools.packages.find]
include = ["threatsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"